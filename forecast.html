<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قارئ ملفات TREE الفوري</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f6f4; color: #333; padding: 20px; }
  .container { max-width: 1100px; margin: 0 auto; }
  .upload-box { background: #fff; border: 2px dashed #1D9E75; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; margin-bottom: 20px; }
  .status { font-weight: bold; color: #1D9E75; margin-bottom: 15px; font-size: 14px; text-align: center; }
  .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; }
  .stat-card { background: #fff; padding: 15px; border-radius: 8px; flex: 1; border: 1px solid #e0e0e0; text-align: center; }
  .stat-card h3 { font-size: 12px; color: #666; margin-bottom: 5px; }
  .stat-card p { font-size: 20px; font-weight: bold; color: #1D9E75; }
  .table-wrap { background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; overflow-x: auto; max-height: 600px; }
  table { width: 100%; border-collapse: collapse; text-align: right; font-size: 13px; }
  th { background: #f8faf9; padding: 12px; border-bottom: 2px solid #e0e0e0; position: sticky; top: 0; color: #444; }
  td { padding: 10px 12px; border-bottom: 1px solid #eee; }
  tr:hover { background: #f9f9f9; }
</style>
</head>
<body>

<div class="container">
  <div class="upload-box" onclick="document.getElementById('excel-file').click()">
    <h2>اضغط هنا لرفع ملف الإكسيل وقراءته فوراً 📄</h2>
    <p>سيقوم الكود بمسح الشيت وعرض البيانات المكتشفة بالكامل</p>
    <input type="file" id="excel-file" accept=".xlsx,.xls,.csv" style="display:none">
  </div>

  <div id="status-msg" class="status">جاهز بانتظار رفع الملف...</div>

  <div class="stats-bar" id="stats" style="display:none;">
    <div class="stat-card"><h3>إجمالي السطور المقروءة</h3><p id="total-rows">0</p></div>
    <div class="stat-card"><h3>إجمالي الكميات المباعة</h3><p id="total-qty">0</p></div>
  </div>

  <div class="table-wrap" id="table-container" style="display:none;">
    <table id="result-table">
      <thead><tr id="table-headers"></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<script>
document.getElementById('excel-file').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;

  document.getElementById('status-msg').textContent = "جاري قراءة الملف فوريًا...";
  
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = new Uint8Array(ev.target.result);
      var workbook = XLSX.read(data, {type: 'array'});
      var sheetName = workbook.SheetNames[0];
      var worksheet = workbook.Sheets[sheetName];
      
      // تحويل الشيت لصفوف خام للبحث عن السطر الصحيح
      var rawRows = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ''});
      
      var headerIndex = 0;
      for (var i = 0; i < rawRows.length; i++) {
        var rowText = rawRows[i].join(' ');
        // البحث عن أي كلمة تدل على الجدول لتبدأ القراءة منها
        if (rowText.includes('ريخ') || rowText.includes('صنف') || rowText.includes('مباع')) {
          headerIndex = i;
          break;
        }
      }

      // إعادة القراءة بناءً على السطر المكتشف
      var jsonData = XLSX.utils.sheet_to_json(worksheet, {range: headerIndex, defval: ''});
      
      if (jsonData.length === 0) {
        document.getElementById('status-msg').textContent = "❌ تم فتح الملف ولكن لم يتم العثور على بيانات في الجدول.";
        return;
      }

      // عرض الإحصائيات
      document.getElementById('total-rows').textContent = jsonData.length.toLocaleString();
      
      // حساب إجمالي الكميات dynamically
      var qtyKey = Object.keys(jsonData[0]).find(k => k.includes('مباع') || k.includes('الكمية'));
      var totalQty = 0;
      if (qtyKey) {
        totalQty = jsonData.reduce((sum, row) => sum + (parseFloat(row[qtyKey]) || 0), 0);
      }
      document.getElementById('total-qty').textContent = Math.round(totalQty).toLocaleString();

      // بناء عناوين الجدول
      var headers = Object.keys(jsonData[0]);
      var headerHtml = headers.map(h => `<th>${h}</th>`).join('');
      document.getElementById('table-headers').innerHTML = headerHtml;

      // بناء أسطر البيانات (أول 300 سطر للسرعة والأداء)
      var rowsHtml = jsonData.slice(0, 300).map(row => {
        return `<tr>${headers.map(h => `<td>${row[h] || ''}</td>`).join('')}</tr>`;
      }).join('');
      
      document.getElementById('table-body').innerHTML = rowsHtml;
      
      // إظهار العناصر
      document.getElementById('status-msg').textContent = "✅ تم جلب وقراءة البيانات بنجاح!";
      document.getElementById('stats').style.display = 'flex';
      document.getElementById('table-container').style.display = 'block';

    } catch (err) {
      document.getElementById('status-msg').textContent = "❌ حدث خطأ أثناء القراءة: " + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
});
</script>
</body>
</html>
