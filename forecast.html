<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>توقع المبيعات - TREE</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#f0f4f0;padding:20px}
        .container{max-width:1100px;margin:0 auto}
        .upload{background:#fff;border:2px dashed #1D9E75;border-radius:20px;padding:60px;text-align:center;cursor:pointer;margin-bottom:24px}
        .upload:hover{background:#f0faf6}
        .hidden{display:none}
        .success{background:#EAF3DE;color:#3B6D11;padding:12px;border-radius:12px;margin-bottom:16px}
        .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
        .metric{background:#fff;border-radius:16px;padding:20px;text-align:center;border-right:4px solid #1D9E75}
        .metric-value{font-size:32px;font-weight:900}
        canvas{max-height:300px;width:100%}
        table{width:100%;border-collapse:collapse;margin-top:16px}
        th,td{padding:12px;text-align:right;border-bottom:1px solid #e8f0ec}
        th{background:#f8faf9}
        .tab{background:#fff;border:none;padding:10px 24px;border-radius:30px;cursor:pointer;margin-left:8px}
        .tab.active{background:#1D9E75;color:#fff}
    </style>
</head>
<body>
<div class="container">
    <div class="upload" onclick="document.getElementById('fileInput').click()">
        <div style="font-size:48px;margin-bottom:12px">📊</div>
        <h3>ارفع ملف Excel</h3>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    <div id="dashboard" class="hidden">
        <div class="metrics" id="metrics"></div>
        <div style="margin-bottom:16px">
            <button class="tab active" onclick="showTab('trend')">📈 تريند</button>
            <button class="tab" onclick="showTab('forecast')">🔮 توقع</button>
        </div>
        <div class="metric" id="chartCard"><canvas id="myChart"></canvas></div>
        <div class="metric" id="forecastCard" style="display:none">
            <div style="font-size:48px;font-weight:900;color:#1D9E75;padding:40px" id="forecastValue"></div>
        </div>
    </div>
</div>

<script>
let chart = null;
let salesData = [];
let periods = [];

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const wb = XLSX.read(ev.target.result, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            
            if (!rows || rows.length < 2) throw new Error('الملف فارغ');
            
            const headers = rows[0];
            let dateIdx = -1, qtyIdx = -1;
            
            for (let i = 0; i < headers.length; i++) {
                const h = String(headers[i] || '').toLowerCase();
                if (h.includes('تاريخ') || h.includes('التاريخ')) dateIdx = i;
                if (h.includes('صافي') || h.includes('مباع') || h.includes('الكمية')) qtyIdx = i;
            }
            
            if (dateIdx === -1) throw new Error('لم أجد عمود التاريخ');
            if (qtyIdx === -1) throw new Error('لم أجد عمود الكمية');
            
            const periodMap = new Map();
            
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                const date = String(row[dateIdx] || '').trim();
                if (!date) continue;
                
                let qty = parseFloat(row[qtyIdx]);
                if (isNaN(qty)) qty = 0;
                if (qty === 0) continue;
                
                if (!periodMap.has(date)) periodMap.set(date, 0);
                periodMap.set(date, periodMap.get(date) + qty);
            }
            
            if (periodMap.size === 0) throw new Error('لا توجد بيانات صالحة');
            
            periods = Array.from(periodMap.keys());
            salesData = Array.from(periodMap.values());
            
            const total = salesData.reduce((s, v) => s + v, 0);
            const avg = total / salesData.length;
            const forecast = Math.round(avg * 1.05);
            
            document.getElementById('metrics').innerHTML = `
                <div class="metric"><div class="metric-value">${total.toLocaleString()}</div><div>إجمالي المبيعات</div><div style="font-size:11px;color:#888">${periods.length} فترات</div></div>
                <div class="metric"><div class="metric-value">${salesData[0].toLocaleString()}</div><div>${periods[0]}</div></div>
                <div class="metric"><div class="metric-value" style="color:#1D9E75">${forecast.toLocaleString()}</div><div>توقع القادمة</div><div style="font-size:11px">نمو 5%</div></div>
            `;
            
            document.getElementById('forecastValue').innerHTML = `${forecast.toLocaleString()} قطعة`;
            
            if (chart) chart.destroy();
            const ctx = document.getElementById('myChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: { labels: periods, datasets: [{ label: 'المبيعات', data: salesData, backgroundColor: '#1D9E75', borderRadius: 8 }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
            
            document.getElementById('dashboard').classList.remove('hidden');
            document.querySelector('.upload').style.display = 'none';
            
        } catch(err) {
            alert('خطأ: ' + err.message);
        }
    };
    reader.readAsArrayBuffer(file);
});

function showTab(tab) {
    document.getElementById('chartCard').style.display = tab === 'trend' ? 'block' : 'none';
    document.getElementById('forecastCard').style.display = tab === 'forecast' ? 'block' : 'none';
    document.querySelectorAll('.tab').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && tab === 'trend') || (i === 1 && tab === 'forecast'));
    });
}
</script>
</body>
</html>
