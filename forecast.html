<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قراءة أسماء الأعمدة فقط</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        body{font-family:'Segoe UI',sans-serif;background:#f0f4f0;padding:20px}
        .box{background:#fff;border:2px dashed #1D9E75;border-radius:20px;padding:48px;text-align:center;cursor:pointer;margin-bottom:24px}
        .box:hover{background:#f0faf6}
        .result{background:#fff;border-radius:16px;padding:24px;margin-top:20px}
        .success{background:#EAF3DE;color:#3B6D11;padding:12px;border-radius:12px;margin-bottom:16px}
        .error{background:#FCEBEB;color:#A32D2D;padding:12px;border-radius:12px;margin-bottom:16px}
        .col-name{background:#f8f9fa;padding:8px 16px;margin:8px 0;border-radius:8px;font-family:monospace;direction:ltr;text-align:left}
        table{width:100%;border-collapse:collapse;margin-top:16px}
        th,td{padding:12px;text-align:right;border-bottom:1px solid #e8f0ec}
        th{background:#f8faf9}
    </style>
</head>
<body>
<div style="max-width:800px;margin:0 auto">
    <div class="box" onclick="document.getElementById('fileInput').click()">
        <div style="font-size:48px;margin-bottom:12px">📊</div>
        <h3>اضغط لرفع ملف Excel</h3>
        <p style="color:#888;font-size:12px;margin-top:8px">سيتم عرض أسماء الأعمدة فقط</p>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none">
    <div id="result"></div>
</div>

<script>
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '<div class="success">⏳ جاري قراءة الملف...</div>';
    
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const data = new Uint8Array(ev.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            // قراءة أول ورقة
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            
            // تحويل إلى JSON مع أخذ الصف الأول كعناوين
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            
            if (!json || json.length === 0) {
                throw new Error('الملف فارغ');
            }
            
            // الصف الأول = أسماء الأعمدة
            const headers = json[0];
            
            // عرض النتائج
            let html = `<div class="success">✅ تم قراءة الملف بنجاح</div>`;
            html += `<div style="margin-top:16px"><strong>📌 أسماء الأوراق:</strong> ${workbook.SheetNames.join(' - ')}</div>`;
            html += `<div style="margin-top:16px"><strong>📊 عدد الصفوف في الملف:</strong> ${json.length} صف (بما فيها العنوان)</div>`;
            html += `<div style="margin-top:16px"><strong>📋 عدد الأعمدة:</strong> ${headers.length} عمود</div>`;
            html += `<div style="margin-top:16px"><strong>🏷️ أسماء الأعمدة:</strong></div>`;
            
            // جدول بأسماء الأعمدة
            html += `<table>`;
            html += `<thead><tr><th>#</th><th>اسم العمود</th><th>طول الاسم</th><th>يوجد سطر جديد \\n ؟</th></tr></thead><tbody>`;
            
            for (let i = 0; i < headers.length; i++) {
                const colName = String(headers[i] || '');
                const hasNewLine = colName.includes('\n') ? '✅ نعم' : '❌ لا';
                const hasReturn = colName.includes('\r') ? '✅ نعم' : '❌ لا';
                html += `<tr>
                    <td>${i+1}</td>
                    <td style="font-family:monospace;direction:ltr;text-align:left">${colName}</td>
                    <td>${colName.length}</td>
                    <td>${hasNewLine} ${hasReturn}</td>
                </tr>`;
            }
            
            html += `</tbody></table>`;
            
            // عرض أول 3 صفوف من البيانات
            html += `<div style="margin-top:24px"><strong>📊 أول 3 صفوف من البيانات:</strong></div>`;
            html += `<pre style="background:#f8f9fa;padding:16px;border-radius:12px;overflow:auto;font-size:11px;direction:ltr;text-align:left">${JSON.stringify(json.slice(0, 4), null, 2)}</pre>`;
            
            resultDiv.innerHTML = html;
            
        } catch(err) {
            resultDiv.innerHTML = `<div class="error">❌ خطأ: ${err.message}</div>`;
            console.error(err);
        }
    };
    reader.readAsArrayBuffer(file);
});
</script>
</body>
</html>
