<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توقع المبيعات — تشخيص</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#f0f4f0;padding:20px}
    .container{max-width:1000px;margin:0 auto}
    .card{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
    .upload-area{background:#fff;border:2px dashed #1D9E75;border-radius:16px;padding:48px;text-align:center;cursor:pointer}
    .debug{background:#f8f9fa;border:1px solid #dee2e6;border-radius:12px;padding:16px;font-family:monospace;font-size:12px;margin-top:20px;white-space:pre-wrap;word-break:break-all}
    .error{background:#fcebeb;color:#a32d2d;padding:12px;border-radius:12px;margin-top:16px}
    .success{background:#eaf3de;color:#3b6d11;padding:12px;border-radius:12px;margin-top:16px}
    button{background:#1D9E75;color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;margin-top:12px}
    table{width:100%;border-collapse:collapse;margin-top:16px}
    th,td{border:1px solid #ddd;padding:8px;text-align:right}
    th{background:#f0f0f0}
    .hidden{display:none}
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>🔍 توقع المبيعات — نسخة تشخيصية</h2>
        <p style="color:#666;margin-top:8px">سيتم عرض تفاصيل القراءة لمعرفة أين المشكلة</p>
    </div>

    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div style="font-size:48px">📊</div>
        <h3>اضغط لرفع ملف Excel</h3>
        <p style="color:#888;font-size:12px;margin-top:8px">xlsx, xls, csv</p>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none">

    <div id="debugPanel" class="debug">
        <strong>📋 سجل التشخيص:</strong><br>
        في انتظار رفع ملف...
    </div>

    <div id="dashboard" class="hidden">
        <div class="card">
            <h3>📊 إجمالي المبيعات</h3>
            <div id="metrics"></div>
            <canvas id="trendChart" style="max-height:300px;margin-top:20px"></canvas>
        </div>
    </div>
</div>

<script>
let chart = null;

function log(msg, isError = false) {
    const panel = document.getElementById('debugPanel');
    const color = isError ? 'red' : '#333';
    panel.innerHTML += `<div style="color:${color};margin-top:4px">${new Date().toLocaleTimeString()} - ${msg}</div>`;
    panel.scrollTop = panel.scrollHeight;
    console.log(msg);
}

document.getElementById('fileInput').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    log(`📁 تم اختيار الملف: ${file.name} (${(file.size/1024).toFixed(2)} KB)`);
    
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            log(`📖 قراءة الملف بنجاح، حجم البيانات: ${ev.target.result.byteLength} bytes`);
            
            const data = new Uint8Array(ev.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            log(`📚 عدد الأوراق: ${workbook.SheetNames.length} - الأوراق: ${workbook.SheetNames.join(', ')}`);
            
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(worksheet, { defval: '', raw: false });
            
            log(`📊 عدد الصفوف في الورقة الأولى: ${json.length}`);
            
            if (json.length === 0) {
                log(`❌ لا توجد بيانات في الملف`, true);
                return;
            }
            
            // عرض أول 3 صفوف
            log(`📋 أول 3 صفوف من البيانات:`);
            for (let i = 0; i < Math.min(3, json.length); i++) {
                log(`   الصف ${i+1}: ${JSON.stringify(json[i]).substring(0, 200)}`);
            }
            
            // عرض أسماء الأعمدة
            const headers = Object.keys(json[0]);
            log(`📌 أسماء الأعمدة (${headers.length} عمود):`);
            headers.forEach((h, i) => {
                log(`   ${i+1}. "${h}" - طول الاسم: ${h.length}`);
                // كشف وجود أسطر جديدة
                if (h.includes('\n')) {
                    log(`      ⚠️ هذا العمود يحتوي على سطر جديد (\\n)`, true);
                }
                if (h.includes('\r')) {
                    log(`      ⚠️ هذا العمود يحتوي على سطر جديد (\\r)`, true);
                }
            });
            
            // البحث عن أعمدة محددة
            const dateCol = headers.find(h => h.includes('تاريخ'));
            const qtyCol = headers.find(h => h.includes('صافي') || h.includes('الكمية'));
            
            log(`🔍 عمود التاريخ الموجود: "${dateCol || 'غير موجود'}"`);
            log(`🔍 عمود الكمية الموجود: "${qtyCol || 'غير موجود'}"`);
            
            if (!dateCol) {
                log(`❌ لم يتم العثور على عمود التاريخ`, true);
                return;
            }
            if (!qtyCol) {
                log(`❌ لم يتم العثور على عمود الكمية`, true);
                return;
            }
            
            // تحليل البيانات
            let validRows = 0;
            let parsedPeriods = [];
            
            for (let row of json) {
                const periodStr = row[dateCol] || '';
                const qty = parseFloat(row[qtyCol]) || 0;
                
                if (periodStr && qty > 0) {
                    validRows++;
                    parsedPeriods.push(periodStr);
                }
            }
            
            log(`✅ عدد الصفوف الصالحة (تاريخ غير فارغ + كمية > 0): ${validRows}`);
            
            if (validRows === 0) {
                log(`⚠️ لا توجد صفوف صالحة. تأكد من أن عمود "صافي الكمية" يحتوي على أرقام أكبر من 0`, true);
                // عرض أول 5 قيم للكمية
                log(`📊 عينة من قيم الكمية (أول 5 صفوف):`);
                for (let i = 0; i < Math.min(5, json.length); i++) {
                    const val = json[i][qtyCol];
                    log(`   الصف ${i+1}: "${val}" → رقم: ${parseFloat(val)}`);
                }
                return;
            }
            
            log(`✅ الملف صالح ويحتوي على ${validRows} صف!`);
            document.getElementById('dashboard').classList.remove('hidden');
            
            // تجميع البيانات
            const groupMap = new Map();
            for (let row of json) {
                const periodStr = row[dateCol] || '';
                const qty = parseFloat(row[qtyCol]) || 0;
                if (!periodStr || qty === 0) continue;
                
                const group = row['المجموعة الرئيسية'] || 'غير محدد';
                if (!groupMap.has(group)) groupMap.set(group, 0);
                groupMap.set(group, groupMap.get(group) + qty);
            }
            
            const labels = Array.from(groupMap.keys());
            const values = Array.from(groupMap.values());
            
            // رسم الرسم البياني
            if (chart) chart.destroy();
            const ctx = document.getElementById('trendChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'المبيعات', data: values, backgroundColor: '#1D9E75' }] },
                options: { responsive: true }
            });
            
            document.getElementById('metrics').innerHTML = `
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px">
                    <div style="text-align:center"><div style="font-size:32px;font-weight:900">${validRows}</div><div style="color:#666">صف صالح</div></div>
                    <div style="text-align:center"><div style="font-size:32px;font-weight:900">${labels.length}</div><div style="color:#666">مجموعة</div></div>
                    <div style="text-align:center"><div style="font-size:32px;font-weight:900">${values.reduce((a,b)=>a+b,0).toLocaleString()}</div><div style="color:#666">إجمالي المبيعات</div></div>
                </div>
            `;
            
        } catch(err) {
            log(`❌ خطأ: ${err.message}`, true);
            console.error(err);
        }
    };
    reader.readAsArrayBuffer(file);
});

// Drag and drop
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = '#e8f7f1'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.background = ''; });
dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.background = '';
    const file = e.dataTransfer.files[0];
    if (file) {
        const dt = new DataTransfer();
        dt.items.add(file);
        document.getElementById('fileInput').files = dt.files;
        document.getElementById('fileInput').dispatchEvent(new Event('change'));
    }
});
</script>
</body>
</html>
