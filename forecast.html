<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار قراءة الملف</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        body{font-family:sans-serif;padding:20px;background:#f0f4f0}
        .box{background:#fff;border:2px solid #1D9E75;border-radius:16px;padding:40px;text-align:center;cursor:pointer;margin-bottom:20px}
        pre{background:#f8f9fa;padding:16px;border-radius:12px;overflow:auto;font-size:12px}
        .success{background:#EAF3DE;color:#3B6D11;padding:16px;border-radius:12px;margin-top:16px}
        .error{background:#FCEBEB;color:#A32D2D;padding:16px;border-radius:12px;margin-top:16px}
    </style>
</head>
<body>
<div style="max-width:800px;margin:0 auto">
    <div class="box" onclick="document.getElementById('fileInput').click()">
        📂 اختر ملف Excel
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    <div id="result"></div>
</div>

<script>
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '<div class="success">⏳ جاري قراءة الملف...</div>';
    
    // أولاً: نقرأ الملف كـ ArrayBuffer
    const reader = new FileReader();
    
    reader.onload = function(ev) {
        try {
            const data = ev.target.result;
            resultDiv.innerHTML += `<div class="success">✅ تم قراءة ${data.byteLength} bytes</div>`;
            
            // نحاول فتحه باستخدام SheetJS
            const workbook = XLSX.read(data, { type: 'array' });
            resultDiv.innerHTML += `<div class="success">✅ تم فتح الملف - عدد الأوراق: ${workbook.SheetNames.length}</div>`;
            
            // نقرأ أول ورقة
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            
            resultDiv.innerHTML += `<div class="success">✅ عدد الصفوف: ${json.length}</div>`;
            
            if (json.length > 0) {
                resultDiv.innerHTML += `<div class="success">✅ الصف الأول (العناوين):</div>`;
                resultDiv.innerHTML += `<pre>${JSON.stringify(json[0], null, 2)}</pre>`;
            }
            
            if (json.length > 1) {
                resultDiv.innerHTML += `<div class="success">✅ أول 3 صفوف من البيانات:</div>`;
                resultDiv.innerHTML += `<pre>${JSON.stringify(json.slice(1, 4), null, 2)}</pre>`;
            }
            
        } catch(err) {
            resultDiv.innerHTML += `<div class="error">❌ خطأ في التحليل: ${err.message}</div>`;
        }
    };
    
    reader.onerror = function() {
        resultDiv.innerHTML = '<div class="error">❌ لا يمكن قراءة الملف</div>';
    };
    
    reader.readAsArrayBuffer(file);
});
</script>
</body>
</html>
