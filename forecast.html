<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>توقع المبيعات - TREE</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#f0f4f0;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        .upload{background:#fff;border:2px dashed #1D9E75;border-radius:20px;padding:50px;text-align:center;cursor:pointer;margin-bottom:20px}
        .upload:hover{background:#f0faf6}
        .hidden{display:none}
        .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
        .metric{background:#fff;border-radius:16px;padding:20px;text-align:center;border-right:4px solid #1D9E75}
        .metric-value{font-size:32px;font-weight:900}
        .green{color:#1D9E75}
        canvas{max-height:300px;width:100%}
        .tabs{display:flex;gap:8px;margin-bottom:20px}
        .tab{background:#fff;border:none;padding:10px 24px;border-radius:30px;cursor:pointer}
        .tab.active{background:#1D9E75;color:#fff}
    </style>
</head>
<body>
<div class="container">
    <div class="upload" onclick="document.getElementById('fileInput').click()">
        <div style="font-size:48px">📊</div>
        <h3>ارفع ملف Excel</h3>
        <p style="color:#888;font-size:12px;margin-top:8px">xlsx, xls فقط</p>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    <div id="dashboard" class="hidden">
        <div class="metrics" id="metrics"></div>
        <div class="tabs">
            <button class="tab active" onclick="showTab('trend')">📈 تريند المبيعات</button>
            <button class="tab" onclick="showTab('forecast')">🔮 توقع الفترة القادمة</button>
        </div>
        <div id="trendDiv"><canvas id="trendChart"></canvas></div>
        <div id="forecastDiv" style="display:none;background:#fff;border-radius:16px;padding:40px;text-align:center">
            <div style="font-size:48px;font-weight:900;color:#1D9E75" id="forecastValue"></div>
            <div style="margin-top:16px;color:#888">توقع الفترة القادمة (نمو 5%)</div>
        </div>
    </div>
</div>

<script>
let chart = null;

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const data = ev.target.result;
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet);

            if (!json || json.length === 0) throw new Error('الملف فارغ');

            // تجميع حسب التاريخ
            const periodMap = new Map();
            let hasQty = false;

            for (let row of json) {
                let period = row['تاريخ'] || row['التاريخ'] || '';
                let qty = row['صافي الكمية المباعه'] || row['صافي الكمية'] || row['الكمية'] || 0;
                qty = parseFloat(qty);
                
                if (period && !isNaN(qty) && qty > 0) {
                    hasQty = true;
                    periodMap.set(period, (periodMap.get(period) || 0) + qty);
                }
            }

            if (!hasQty) throw new Error('لا توجد كميات صالحة في العمود');

            if (periodMap.size === 0) throw new Error('لا توجد بيانات صالحة');

            const periods = Array.from(periodMap.keys());
            const sales = Array.from(periodMap.values());
            const total = sales.reduce((a, b) => a + b, 0);
            const avg = total / sales.length;
            const forecast = Math.round(avg * 1.05);

            document.getElementById('metrics').innerHTML = `
                <div class="metric"><div class="metric-value">${total.toLocaleString()}</div><div>اجمالي المبيعات</div><div style="font-size:11px;color:#888">${periods.length} فترات</div></div>
                <div class="metric"><div class="metric-value">${sales[0].toLocaleString()}</div><div>${periods[0]}</div></div>
                <div class="metric"><div class="metric-value green">${forecast.toLocaleString()}</div><div>توقع القادمة</div><div style="font-size:11px">نمو 5%</div></div>
            `;

            document.getElementById('forecastValue').innerHTML = `${forecast.toLocaleString()} قطعة`;

            if (chart) chart.destroy();
            const ctx = document.getElementById('trendChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: { labels: periods, datasets: [{ label: 'المبيعات', data: sales, backgroundColor: '#1D9E75', borderRadius: 8 }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom' } } }
            });

            document.getElementById('dashboard').classList.remove('hidden');
            document.querySelector('.upload').style.display = 'none';

        } catch(err) {
            alert('خطأ: ' + err.message);
        }
    };
    reader.readAsArrayBuffer(file);
});

function showTab(tab) {
    document.getElementById('trendDiv').style.display = tab === 'trend' ? 'block' : 'none';
    document.getElementById('forecastDiv').style.display = tab === 'forecast' ? 'block' : 'none';
    document.querySelectorAll('.tab').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && tab === 'trend') || (i === 1 && tab === 'forecast'));
    });
}
</script>
</body>
</html>
