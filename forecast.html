<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>توقع المبيعات - TREE</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#f0f4f0;padding:20px}
        .container{max-width:1100px;margin:0 auto}
        .upload{background:#fff;border:2px dashed #1D9E75;border-radius:20px;padding:60px;text-align:center;cursor:pointer;margin-bottom:24px}
        .upload:hover{background:#f0faf6}
        .hidden{display:none}
        .success{background:#EAF3DE;color:#3B6D11;padding:12px;border-radius:12px;margin-bottom:16px}
        .error{background:#FCEBEB;color:#A32D2D;padding:12px;border-radius:12px;margin-bottom:16px}
        .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
        .metric{background:#fff;border-radius:16px;padding:20px;text-align:center;border-right:4px solid #1D9E75}
        .metric-value{font-size:32px;font-weight:900}
        canvas{max-height:300px;width:100%}
        .tabs{display:flex;gap:8px;margin-bottom:20px}
        .tab{background:#fff;border:none;padding:10px 24px;border-radius:30px;cursor:pointer}
        .tab.active{background:#1D9E75;color:#fff}
    </style>
</head>
<body>
<div class="container">
    <div class="upload" onclick="document.getElementById('fileInput').click()">
        <div style="font-size:48px">📊</div>
        <h3>ارفع ملف Excel</h3>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    <div id="dashboard" class="hidden">
        <div class="metrics" id="metrics"></div>
        <div class="tabs">
            <button class="tab active" onclick="showTab('trend')">📈 تريند</button>
            <button class="tab" onclick="showTab('forecast')">🔮 توقع</button>
        </div>
        <div id="trendDiv"><canvas id="trendChart"></canvas></div>
        <div id="forecastDiv" style="display:none;background:#fff;border-radius:16px;padding:40px;text-align:center">
            <div style="font-size:48px;font-weight:900;color:#1D9E75" id="forecastValue"></div>
            <div style="margin-top:16px;color:#888">توقع الفترة القادمة (نمو 5%)</div>
        </div>
    </div>
</div>

<script>
let chart = null;

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const statusDiv = document.createElement('div');
    statusDiv.className = 'success';
    statusDiv.innerHTML = '⏳ جاري قراءة الملف...';
    document.querySelector('.upload').after(statusDiv);
    
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            // الطريقة الأكثر توافقاً لقراءة الملف
            const data = new Uint8Array(ev.target.result);
            const workbook = XLSX.read(data, { 
                type: 'array',
                cellDates: false,
                cellText: true,
                cellNF: false,
                sheetStubs: false
            });
            
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            
            // استخدام {header: 1} لقراءة كل الخلايا كنصوص
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            
            statusDiv.innerHTML = `✅ تم قراءة ${rows.length} صف`;
            setTimeout(() => statusDiv.remove(), 3000);
            
            if (!rows || rows.length < 2) {
                throw new Error('الملف لا يحتوي على بيانات');
            }
            
            // البحث عن أرقام الأعمدة
            const headers = rows[0];
            let dateCol = -1, qtyCol = -1;
            
            for (let i = 0; i < headers.length; i++) {
                const cell = String(headers[i] || '').toLowerCase();
                if (cell.includes('تاريخ') || cell.includes('التاريخ')) dateCol = i;
                if (cell.includes('صافي') || cell.includes('مباع')) qtyCol = i;
            }
            
            // إذا لم نجد الأعمدة، نجرب البحث بشكل أوسع
            if (dateCol === -1) {
                for (let i = 0; i < headers.length; i++) {
                    const cell = String(headers[i] || '').toLowerCase();
                    if (cell.includes('تاري')) dateCol = i;
                }
            }
            if (qtyCol === -1) {
                for (let i = 0; i < headers.length; i++) {
                    const cell = String(headers[i] || '').toLowerCase();
                    if (cell.includes('كمية') || cell.includes('مبيعات')) qtyCol = i;
                }
            }
            
            // تجميع البيانات
            const periodMap = new Map();
            let validRows = 0;
            
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                let period = '';
                let qty = 0;
                
                if (dateCol !== -1) period = String(row[dateCol] || '').trim();
                if (qtyCol !== -1) qty = parseFloat(row[qtyCol]);
                if (isNaN(qty)) qty = 0;
                
                if (period && qty > 0) {
                    validRows++;
                    periodMap.set(period, (periodMap.get(period) || 0) + qty);
                }
            }
            
            if (validRows === 0) {
                // محاولة أخيرة: استخدام أول عمود نصي كتاريخ وأول عمود رقمي ككمية
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    for (let j = 0; j < row.length; j++) {
                        const val = row[j];
                        if (typeof val === 'string' && val.trim() && val.match(/\d{1,2}-\d{4}/)) {
                            period = val.trim();
                        }
                        if (typeof val === 'number' && val > 0) {
                            qty = val;
                        }
                    }
                    if (period && qty > 0) {
                        validRows++;
                        periodMap.set(period, (periodMap.get(period) || 0) + qty);
                    }
                }
            }
            
            if (periodMap.size === 0) {
                throw new Error(`لا توجد بيانات صالحة. تم فحص ${rows.length-1} صف. تأكد من وجود أرقام في عمود الكمية`);
            }
            
            // عرض البيانات
            const periods = Array.from(periodMap.keys());
            const sales = Array.from(periodMap.values());
            const total = sales.reduce((a,b) => a+b, 0);
            const avg = total / sales.length;
            const forecast = Math.round(avg * 1.05);
            
            document.getElementById('metrics').innerHTML = `
                <div class="metric"><div class="metric-value">${total.toLocaleString()}</div><div>إجمالي المبيعات</div><div style="font-size:11px;color:#888">${periods.length} فترات</div></div>
                <div class="metric"><div class="metric-value">${sales[0].toLocaleString()}</div><div>${periods[0]}</div></div>
                <div class="metric"><div class="metric-value" style="color:#1D9E75">${forecast.toLocaleString()}</div><div>توقع القادمة</div><div style="font-size:11px">نمو 5%</div></div>
            `;
            
            document.getElementById('forecastValue').innerHTML = `${forecast.toLocaleString()} قطعة`;
            
            if (chart) chart.destroy();
            const ctx = document.getElementById('trendChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: { labels: periods, datasets: [{ label: 'المبيعات', data: sales, backgroundColor: '#1D9E75', borderRadius: 8 }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
            
            document.getElementById('dashboard').classList.remove('hidden');
            document.querySelector('.upload').style.display = 'none';
            statusDiv.remove();
            
        } catch(err) {
            statusDiv.className = 'error';
            statusDiv.innerHTML = `❌ ${err.message}`;
            console.error(err);
        }
    };
    reader.readAsArrayBuffer(file);
});

function showTab(tab) {
    document.getElementById('trendDiv').style.display = tab === 'trend' ? 'block' : 'none';
    document.getElementById('forecastDiv').style.display = tab === 'forecast' ? 'block' : 'none';
    document.querySelectorAll('.tab').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && tab === 'trend') || (i === 1 && tab === 'forecast'));
    });
}
</script>
</body>
</html>
