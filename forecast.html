<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار قراءة الملف</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        body{font-family:sans-serif;padding:20px;background:#f0f4f0}
        .area{background:#fff;border:2px dashed #1D9E75;border-radius:16px;padding:40px;text-align:center;cursor:pointer;margin-bottom:20px}
        pre{background:#f8f9fa;padding:16px;border-radius:12px;overflow:auto;font-size:12px}
        .success{color:#3B6D11;background:#EAF3DE;padding:12px;border-radius:12px}
        .error{color:#A32D2D;background:#FCEBEB;padding:12px;border-radius:12px}
    </style>
</head>
<body>
<div style="max-width:800px;margin:0 auto">
    <div class="area" onclick="document.getElementById('fileInput').click()">
        📂 اضغط لرفع ملف Excel
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    <div id="result"></div>
</div>

<script>
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '<div class="success">⏳ جاري قراءة الملف...</div>';
    
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            // قراءة الملف
            const data = new Uint8Array(ev.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            // أول ورقة
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            
            // تحويل إلى JSON
            const json = XLSX.utils.sheet_to_json(worksheet, { defval: '', raw: false });
            
            // عرض النتيجة
            resultDiv.innerHTML = `
                <div class="success">✅ تم قراءة الملف بنجاح</div>
                <div style="background:#fff;padding:16px;border-radius:12px;margin-top:16px">
                    <p><strong>📊 عدد الصفوف:</strong> ${json.length}</p>
                    <p><strong>📌 أسماء الأعمدة:</strong></p>
                    <ul>${Object.keys(json[0] || {}).map(h => `<li>${h}</li>`).join('')}</ul>
                    <p><strong>📋 أول 3 صفوف:</strong></p>
                    <pre>${JSON.stringify(json.slice(0, 3), null, 2)}</pre>
                </div>
            `;
        } catch(err) {
            resultDiv.innerHTML = `<div class="error">❌ خطأ: ${err.message}</div>`;
        }
    };
    reader.readAsArrayBuffer(file);
});
</script>
</body>
</html>
