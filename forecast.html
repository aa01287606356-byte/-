<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>توقع المبيعات - TREE</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#f0f4f0;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        .upload{background:#fff;border:2px dashed #1D9E75;border-radius:20px;padding:50px;text-align:center;cursor:pointer;margin-bottom:20px}
        .upload:hover{background:#f0faf6}
        .hidden{display:none}
        .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
        .metric{background:#fff;border-radius:16px;padding:20px;text-align:center}
        .metric-value{font-size:32px;font-weight:900;color:#1D9E75}
        canvas{max-height:300px;width:100%}
        .tab{background:#fff;border:none;padding:10px 24px;border-radius:30px;cursor:pointer;margin-left:8px}
        .tab.active{background:#1D9E75;color:#fff}
    </style>
</head>
<body>
<div class="container">
    <div class="upload" onclick="document.getElementById('fileInput').click()">
        <div style="font-size:48px">📊</div>
        <div>اضغط لرفع ملف CSV أو Excel</div>
        <div style="font-size:12px;color:#888;margin-top:8px">يفضل استخدام ملف CSV للحصول على أفضل نتيجة</div>
    </div>
    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" style="display:none">
    <div id="dashboard" class="hidden">
        <div class="metrics" id="metrics"></div>
        <div style="margin-bottom:16px">
            <button class="tab active" onclick="showTab('trend')">📈 تريند</button>
            <button class="tab" onclick="showTab('forecast')">🔮 توقع</button>
        </div>
        <div id="trendDiv"><canvas id="trendChart"></canvas></div>
        <div id="forecastDiv" style="display:none;background:#fff;border-radius:16px;padding:40px;text-align:center">
            <div style="font-size:48px;font-weight:900;color:#1D9E75" id="forecastValue"></div>
        </div>
    </div>
</div>

<script>
let chart = null;

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            let data = [];
            const content = ev.target.result;
            
            // إذا كان CSV
            if (file.name.endsWith('.csv')) {
                const lines = content.split(/\r?\n/);
                const headers = lines[0].split(',');
                
                // البحث عن أرقام الأعمدة
                let dateIdx = -1, qtyIdx = -1;
                for (let i = 0; i < headers.length; i++) {
                    const h = headers[i].toLowerCase();
                    if (h.includes('تاريخ') || h.includes('التاريخ')) dateIdx = i;
                    if (h.includes('صافي') || h.includes('مباع') || h.includes('كمية')) qtyIdx = i;
                }
                
                if (dateIdx === -1) dateIdx = 2; // العمود الثالث غالباً تاريخ
                if (qtyIdx === -1) qtyIdx = 8; // العمود التاسع غالباً كمية
                
                const periodMap = new Map();
                
                for (let i = 1; i < lines.length; i++) {
                    const parts = lines[i].split(',');
                    if (parts.length < 2) continue;
                    
                    const period = parts[dateIdx]?.trim();
                    let qty = parseFloat(parts[qtyIdx]);
                    if (isNaN(qty)) qty = 0;
                    
                    if (period && qty > 0) {
                        periodMap.set(period, (periodMap.get(period) || 0) + qty);
                    }
                }
                
                if (periodMap.size === 0) throw new Error('لا توجد بيانات');
                
                const periods = Array.from(periodMap.keys());
                const sales = Array.from(periodMap.values());
                displayResults(periods, sales);
            }
            else {
                // إذا كان Excel
                const wb = XLSX.read(ev.target.result, { type: 'array' });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
                
                if (!json || json.length < 2) throw new Error('الملف فارغ');
                
                const headers = json[0];
                let dateIdx = -1, qtyIdx = -1;
                
                for (let i = 0; i < headers.length; i++) {
                    const h = String(headers[i] || '').toLowerCase();
                    if (h.includes('تاريخ') || h.includes('التاريخ')) dateIdx = i;
                    if (h.includes('صافي') || h.includes('مباع')) qtyIdx = i;
                }
                
                if (dateIdx === -1) dateIdx = 2;
                if (qtyIdx === -1) qtyIdx = 8;
                
                const periodMap = new Map();
                
                for (let i = 1; i < json.length; i++) {
                    const row = json[i];
                    const period = String(row[dateIdx] || '').trim();
                    if (!period) continue;
                    
                    let qty = parseFloat(row[qtyIdx]);
                    if (isNaN(qty)) qty = 0;
                    if (qty <= 0) continue;
                    
                    periodMap.set(period, (periodMap.get(period) || 0) + qty);
                }
                
                if (periodMap.size === 0) throw new Error('لا توجد بيانات');
                
                const periods = Array.from(periodMap.keys());
                const sales = Array.from(periodMap.values());
                displayResults(periods, sales);
            }
            
        } catch(err) {
            alert('خطأ: ' + err.message + '\n\nحاول تحويل الملف إلى CSV من Excel ثم ارفعه');
        }
    };
    reader.readAsArrayBuffer(file);
});

function displayResults(periods, sales) {
    const total = sales.reduce((a,b) => a+b, 0);
    const avg = total / sales.length;
    const forecast = Math.round(avg * 1.05);
    
    document.getElementById('metrics').innerHTML = `
        <div class="metric"><div class="metric-value">${total.toLocaleString()}</div><div>إجمالي المبيعات</div><div style="font-size:11px;color:#888">${periods.length} فترات</div></div>
        <div class="metric"><div class="metric-value">${sales[0].toLocaleString()}</div><div>${periods[0]}</div></div>
        <div class="metric"><div class="metric-value" style="color:#1D9E75">${forecast.toLocaleString()}</div><div>توقع القادمة</div><div style="font-size:11px">نمو 5%</div></div>
    `;
    
    document.getElementById('forecastValue').innerHTML = `${forecast.toLocaleString()} قطعة`;
    
    if (chart) chart.destroy();
    const ctx = document.getElementById('trendChart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'bar',
        data: { labels: periods, datasets: [{ label: 'المبيعات', data: sales, backgroundColor: '#1D9E75', borderRadius: 8 }] },
        options: { responsive: true, maintainAspectRatio: true }
    });
    
    document.getElementById('dashboard').classList.remove('hidden');
    document.querySelector('.upload').style.display = 'none';
}

function showTab(tab) {
    document.getElementById('trendDiv').style.display = tab === 'trend' ? 'block' : 'none';
    document.getElementById('forecastDiv').style.display = tab === 'forecast' ? 'block' : 'none';
}
</script>
</body>
</html>
