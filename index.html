<script>
// ---------------------  كل دوال safeGet, safeNumber, hasSubstitute, etc. كما هي  ---------------------
// (لن أكررها كلها، لكن يجب أن تبقى كما هي في كودك الأصلي)

// ... ضع هنا جميع الدوال المساعدة التي لديك (safeGet, safeNumber, hasSubstitute, buildSubstituteMap, getSubstituteDetails, showSubstituteDetails, closeModal, إلخ) ...

// ---------------------  الدوال الأساسية (getBranchPasswords, doLogin, doLogout, showApp, showAdmin, renderAdminList, updateBranchPassword) ---------------------
// يجب أن تكون موجودة لديك كما هي. إذا كانت ناقصة، انسخها من آخر كود شغال لديك.

// ---------------------  دوال التحميل والتصنيف (loadFile, processClassification, renderTable, filterTable, updateCharts, exportToSheetsExcel) ---------------------
// سأقوم بتعديل `renderTransferDonor` و `renderTransferBeneficiary` فقط.

// ---- دوال الترانزيت المعدلة (تعرض كل الأعمدة) ----
function renderTransferDonor() {
  const container = document.getElementById('table-transfer-donor');
  let donor = transferData.filter(r => (r['اسم الفرع'] || r['فرع_مصدر'] || '') === currentBranch);
  if (!donor.length) {
    container.innerHTML = '<p style="text-align:center; padding:40px;">🟢 لا توجد توصيات ترانزيت كمانح لهذا الفرع</p>';
    return;
  }
  // الحصول على جميع أسماء الأعمدة من أول صف
  const allKeys = Object.keys(donor[0]);
  // بناء رأس الجدول ديناميكياً
  let html = `<table class="data-table"><thead><tr>${allKeys.map(key => `<th>${key}</th>`).join('')}</tr></thead><tbody>`;
  donor.forEach((row, idx) => {
    html += `<tr class="donor-row">${allKeys.map(key => `<td>${safeGet(row, key, '—')}</td>`).join('')}</tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function renderTransferBeneficiary() {
  const container = document.getElementById('table-transfer-beneficiary');
  let ben = transferData.filter(r => (r['فرع_مستقبل'] || '') === currentBranch);
  if (!ben.length) {
    container.innerHTML = '<p style="text-align:center; padding:40px;">🔴 لا توجد توصيات ترانزيت كمستقبل لهذا الفرع</p>';
    return;
  }
  const allKeys = Object.keys(ben[0]);
  let html = `<table class="data-table"><thead><tr>${allKeys.map(key => `<th>${key}</th>`).join('')}</tr></thead><tbody>`;
  ben.forEach((row, idx) => {
    html += `<tr class="beneficiary-row">${allKeys.map(key => `<td>${safeGet(row, key, '—')}</td>`).join('')}</tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

// دوال الفلترة المحدثة (تعمل على كل الأعمدة)
function filterTransferDonor() {
  const search = document.getElementById('search-transfer-donor')?.value.toLowerCase() || '';
  let donor = transferData.filter(r => (r['اسم الفرع'] || r['فرع_مصدر'] || '') === currentBranch);
  if (search) {
    donor = donor.filter(row => Object.values(row).some(val => String(val).toLowerCase().includes(search)));
  }
  const container = document.getElementById('table-transfer-donor');
  if (!donor.length) {
    container.innerHTML = '<p style="text-align:center; padding:40px;">🟢 لا توجد نتائج</p>';
    return;
  }
  const allKeys = Object.keys(donor[0]);
  let html = `<table class="data-table"><thead><tr>${allKeys.map(key => `<th>${key}</th>`).join('')}</tr></thead><tbody>`;
  donor.forEach(row => {
    html += `<tr class="donor-row">${allKeys.map(key => `<td>${safeGet(row, key, '—')}</td>`).join('')}</tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function filterTransferBeneficiary() {
  const search = document.getElementById('search-transfer-beneficiary')?.value.toLowerCase() || '';
  let ben = transferData.filter(r => (r['فرع_مستقبل'] || '') === currentBranch);
  if (search) {
    ben = ben.filter(row => Object.values(row).some(val => String(val).toLowerCase().includes(search)));
  }
  const container = document.getElementById('table-transfer-beneficiary');
  if (!ben.length) {
    container.innerHTML = '<p style="text-align:center; padding:40px;">🔴 لا توجد نتائج</p>';
    return;
  }
  const allKeys = Object.keys(ben[0]);
  let html = `<table class="data-table"><thead><tr>${allKeys.map(key => `<th>${key}</th>`).join('')}</tr></thead><tbody>`;
  ben.forEach(row => {
    html += `<tr class="beneficiary-row">${allKeys.map(key => `<td>${safeGet(row, key, '—')}</td>`).join('')}</tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

// دالة exportToSheetsExcel المعدلة (لتصدير كل أعمدة الترانزيت أيضاً)
function exportToSheetsExcel() {
  if (!allBranchData.length) return;
  const wb = XLSX.utils.book_new();
  
  const addSheet = (list, name) => {
    const data = list.map((row, idx) => ({ "م": idx+1, ...row }));
    const ws = XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  
  addSheet(classifiedData.new2026, "جديد 2026");
  addSheet(classifiedData.urgent, "نواقص عاجلة");
  addSheet(classifiedData.review, "مراجعة 2025");
  addSheet(classifiedData.stable, "مستقرة");
  addSheet(classifiedData.substitute, "بديل");
  addSheet(classifiedData.balance, "متابعة");
  
  // تصدير كل صفوف الترانزيت الخاصة بالفرع الحالي (بدون حذف أعمدة)
  const donorExport = transferData.filter(r => (r['اسم الفرع'] || r['فرع_مصدر'] || '') === currentBranch);
  const benExport = transferData.filter(r => (r['فرع_مستقبل'] || '') === currentBranch);
  
  if (donorExport.length) {
    const wsDonor = XLSX.utils.json_to_sheet(donorExport);
    XLSX.utils.book_append_sheet(wb, wsDonor, "ترانزيت - مانح");
  } else {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ "تنبيه": "لا توجد توصيات" }]), "ترانزيت - مانح");
  }
  
  if (benExport.length) {
    const wsBen = XLSX.utils.json_to_sheet(benExport);
    XLSX.utils.book_append_sheet(wb, wsBen, "ترانزيت - مستقبل");
  } else {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ "تنبيه": "لا توجد توصيات" }]), "ترانزيت - مستقبل");
  }
  
  XLSX.writeFile(wb, `تقرير_${currentBranch}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ---------------------  باقي الدوال (updateCharts, renderAllTables, إلخ) كما هي ---------------------
// يجب أن تبقى دون تغيير.

// إعادة تعريف مستمعي الأزرار
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'tab-transfer-donor') renderTransferDonor();
    if (btn.dataset.tab === 'tab-transfer-beneficiary') renderTransferBeneficiary();
  });
});

// تأكد من ربط الدوال التي تستخدم onlick في HTML (مثل showSubstituteDetails, closeModal, filterTable, إلخ)
window.filterTable = filterTable;
window.filterTransferDonor = filterTransferDonor;
window.filterTransferBeneficiary = filterTransferBeneficiary;
window.showSubstituteDetails = showSubstituteDetails;
window.closeModal = closeModal;
window.doLogin = doLogin;
window.doLogout = doLogout;
window.loadFile = loadFile;
window.exportToSheetsExcel = exportToSheetsExcel;
window.updateBranchPassword = updateBranchPassword;

</script>
